<title id="title">Launchkey — Tone and Drum sequencer selection</title><desc id="desc">Pads one to four select Tone sequencers A to D. Drum tracks use all sixteen pads to select and play their Drum sequencers, left to right, top row first. Shift/Copy toggles the chosen sequencer's mute.</desc>
