<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
<title id="title">Launchkey Mini MK4 — Prism main sequencer controls</title>
<desc id="desc">Simplified keyboard controller. Eight encoders above sixteen pads control velocity, length, chance, Every, speed, swing, humanize and velocity offset. Pads are steps one to eight on top and nine to sixteen below. Upper and lower buttons beside the encoders supply Prism Shift/Copy and Parameter. Buttons beside the pads supply FX and Function. Left pad arrows navigate pages. Play and Record are at the left. Arp, Scale and Settings cannot be repurposed for Prism and are ignored by its controller map.</desc>
<defs>
 <g id="pads"><rect width="82" height="64" rx="8"/><rect x="92" width="82" height="64" rx="8"/><rect x="184" width="82" height="64" rx="8"/><rect x="276" width="82" height="64" rx="8"/><rect x="368" width="82" height="64" rx="8"/><rect x="460" width="82" height="64" rx="8"/><rect x="552" width="82" height="64" rx="8"/><rect x="644" width="82" height="64" rx="8"/></g>
 <g id="white"><rect width="60" height="146" rx="3" fill="#e5e5de" stroke="#171a20" stroke-width="2"/></g>
 <g id="black"><rect width="32" height="90" rx="3" fill="#24272d" stroke="#0e1014" stroke-width="2"/></g>
 <g id="encoder"><circle r="24" fill="#343a43" stroke="#727985" stroke-width="2"/><path d="M0 -18V-9" stroke="#e1c47d" stroke-width="3"/></g>
</defs>
