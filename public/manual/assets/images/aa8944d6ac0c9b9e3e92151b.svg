<title id="title">Launchkey — Tone and Drum FX selector pad maps</title><desc id="desc">Two banks of sixteen pads. Tone top pads one to four select Chord Blocks, Warp, Arp and Hue. Drum top pads one and two select Euclidean and Warp. Both layouts use pad nine for Sequencer Setup, fifteen to clear the sequence, and sixteen for Pattern.</desc>
