<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Launchkey — mapped parameter editing</title><desc id="desc">Eight encoders edit eight visible parameters. Upper pads clear each parameter's automation or armed LFO target. Lower pad nine is Capture, pads ten to twelve select LFOs one to three. Pad sixteen toggles Macros. Pads thirteen to fifteen have no action in this parameter view.</desc>
